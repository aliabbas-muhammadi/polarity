# M3.3 — the corrected re-run (xp-006), following the M5 version-sensitive diagnosis.
#
# Committed predictions record collapse under Transformers 5.15.1 and success under 4.57.6. The
# decisive diagnostic logs are not committed machine-readably and the upstream change was not
# bisected, so this supports an author-observed version-sensitive failure rather than a uniquely
# established cause. M3.3 retains M3.2's result-affecting recipe (fp32, pAUC selection, four epochs)
# and records Transformers 4.57.6 in its execution profile. The recipe fingerprint therefore equals
# xp-005's while the execution fingerprint differs.
#
# Guard: `polarity train run` calls diagnose.assert_transformers_supported() and REFUSES to start
# on a transformers version outside the reviewed [4.44, 5.0) release profile.
# The pre-registered collapse gate remains active as monitoring for this run.

experiment_id: xp-006-deberta-transformers-fixed

model:
  hf_id: microsoft/deberta-v3-base
  revision: 8ccc9b6f36199bec6961081d44eb72fb3f7353f3
  tokenizer_revision: 8ccc9b6f36199bec6961081d44eb72fb3f7353f3
  license: MIT
  params: "184M (86M backbone + 98M embedding; 12L/768H; vocab 128100)"
  num_labels: 2
  trust_remote_code: false

data:
  recipe: primary-capped-A
  train_manifest: manifests/primary/train.jsonl
  validation_manifest: manifests/primary/validation.jsonl
  internal_test_manifest: manifests/primary/internal_test.jsonl
  approved_sha256:
    train: 656625d6ae3f445c77bfbfdf6b72e887c4785ab674d5ecce7dea4f769959bd95
    validation: 6b31c1028af3b9e9b0113ac02468f4e040366addde828802ae93b344d47118c5
    internal_test: 2f674ccb2f49516bd467d14d9f2ca90a24a8737d7c55fa6a867458db6d6bba88
  allowed_sources: [cannot, paws-wiki]

training:
  objective: binary_cross_entropy
  max_length: 128
  truncation: longest_first
  batch_size: 16
  gradient_accumulation: 2
  learning_rate: 2.0e-5
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-6
  weight_decay: 0.01
  warmup_ratio: 0.06
  scheduler: linear
  epochs: 4
  max_steps: null
  grad_clip: 1.0
  precision: fp32          # unchanged from M3.2; this comparison does not establish causality
  seed: 42
  eval_every_steps: 100
  early_stopping_patience: 99
  class_weights: false

selection:
  metric: pauc
  fpr_budget: 0.01
  tie_break: earliest_step
  pauc_fpr_max: 0.02
  split: validation

calibration:
  candidates: [identity, temperature, platt, isotonic]
  fit_split: validation
  isotonic_min_obs: 200

success:
  rule: paired_uncertainty
  nli_baseline_recall: 0.073  # validation-selected tau; test FP=16/883 (1.81%)
  nli_baseline_recall_ci: [0.055, 0.094]
  nli_baseline_eqn_recall: 0.052
  nli_baseline_eqn_n: 58
  secondary_eqn_margin: 0.05
  guardrail_expl_fp_margin: 0.05
  bootstrap_n: 2000
  bootstrap_seed: 12345

# Pre-registered collapse thresholds (unchanged) remain active as monitoring.
collapse:
  min_score_std: 1.0e-3
  min_unique_scores: 2
  min_class_separation: 1.0e-3
  warmup_evals: 3
  patience_evals: 3

# Owner authorization for M3.3: hard additional spend cap A$1.00 (same discipline as M3.2).
cost:
  max_runtime_hours: 0.85
  max_estimated_cost_aud: 1.0
  planning_hourly_rate_aud: 1.14

env:
  python: ">=3.12"
  transformers: "==4.57.6"    # exact release profile that produced the frozen xp-006 artifact
  torch: ">=2.6,<2.7"          # CVE-2025-32434 needs torch>=2.6 to load the base .bin
  hardware_class: "single 24GB GPU (RTX 4090)"
