# M3.2 — the fp32 recovery experiment (xp-005). A CONTROLLED precision experiment.
#
# Purpose: test ONE causal hypothesis — that the M3/M3.1 collapse to a constant output
# (docs/M4-REPORT.md) was caused primarily by bf16 instability in this DeBERTa-v3-base setup.
# Therefore M3.2 is IDENTICAL to M3.1 (configs/train/m3-1-deberta-v3-base.yaml) in every
# result-affecting field EXCEPT precision:
#   * training.precision: bf16 -> fp32   (the single intentional scientific change)
# Same model/revision, data/manifests, seed, LR/scheduler/warmup/weight-decay/epochs/clip,
# selection.metric=pauc, calibration, success bar. So the xp-004 vs xp-005 fingerprint diff is
# exactly the precision field, and any change in outcome is attributable to precision alone.
#
# Not changed for fp32 memory: batch_size stays 16 (deberta-v3-base at len 128 fits fp32 in 24GB).
# If the run OOMs, the smallest documented adjustment is batch_size 8 / gradient_accumulation 4 —
# effective batch 32 preserved — and that would be recorded before relaunch (brief §2).

experiment_id: xp-005-deberta-fp32

model:
  hf_id: microsoft/deberta-v3-base
  revision: 8ccc9b6f36199bec6961081d44eb72fb3f7353f3
  tokenizer_revision: 8ccc9b6f36199bec6961081d44eb72fb3f7353f3
  license: MIT
  params: "184M (86M backbone + 98M embedding; 12L/768H; vocab 128100)"
  num_labels: 2
  trust_remote_code: false

data:
  recipe: primary-capped-A
  train_manifest: manifests/primary/train.jsonl
  validation_manifest: manifests/primary/validation.jsonl
  internal_test_manifest: manifests/primary/internal_test.jsonl
  approved_sha256:
    train: 656625d6ae3f445c77bfbfdf6b72e887c4785ab674d5ecce7dea4f769959bd95
    validation: 6b31c1028af3b9e9b0113ac02468f4e040366addde828802ae93b344d47118c5
    internal_test: 2f674ccb2f49516bd467d14d9f2ca90a24a8737d7c55fa6a867458db6d6bba88
  allowed_sources: [cannot, paws-wiki]

training:
  objective: binary_cross_entropy
  max_length: 128
  truncation: longest_first
  batch_size: 16
  gradient_accumulation: 2
  learning_rate: 2.0e-5
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-6
  weight_decay: 0.01
  warmup_ratio: 0.06
  scheduler: linear
  epochs: 4
  max_steps: null
  grad_clip: 1.0
  precision: fp32          # M3.2: the ONE intentional change vs M3.1 (was bf16)
  seed: 42
  eval_every_steps: 100
  early_stopping_patience: 99   # run the full 4 epochs (matched to M3.1)
  class_weights: false

selection:
  metric: pauc
  fpr_budget: 0.01
  tie_break: earliest_step
  pauc_fpr_max: 0.02
  split: validation

calibration:
  candidates: [identity, temperature, platt, isotonic]
  fit_split: validation
  isotonic_min_obs: 200

success:
  rule: paired_uncertainty
  nli_baseline_recall: 0.073  # validation-selected tau; test FP=16/883 (1.81%)
  nli_baseline_recall_ci: [0.055, 0.094]
  nli_baseline_eqn_recall: 0.052
  nli_baseline_eqn_n: 58
  secondary_eqn_margin: 0.05
  guardrail_expl_fp_margin: 0.05
  bootstrap_n: 2000
  bootstrap_seed: 12345

# Pre-registered collapse thresholds (brief §3/§4) — equal to the code defaults, stated here for
# transparency. The runtime gate hard-stops the paid run on sustained collapse; the keyless report
# recomputes the same verdict. Diagnostic-only: NOT part of the experiment fingerprint.
collapse:
  min_score_std: 1.0e-3
  min_unique_scores: 2
  min_class_separation: 1.0e-3
  warmup_evals: 3
  patience_evals: 3

# Owner authorization for M3.2: hard additional spend cap A$1.00. Live RTX 4090 SECURE on-demand
# = US$0.74/hr = A$1.14/hr (0.65 AUD/USD, verified at provision). The runner stop-losses training
# wall-clock at the tighter of these caps; the pod also auto-terminates at ~50 min as an infra
# backstop, so even worst case (0.83h * 1.14 = A$0.95) stays under A$1.00.
cost:
  max_runtime_hours: 0.85
  max_estimated_cost_aud: 1.0
  planning_hourly_rate_aud: 1.14

env:
  python: ">=3.12"
  transformers: ">=4.40"
  torch: ">=2"
  hardware_class: "single 24GB GPU (RTX 4090)"
