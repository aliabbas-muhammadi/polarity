name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Sync (locked)
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Test
        run: uv run pytest
      - name: Reproduce metrics (keyless drift gate)
        run: uv run polarity evaluate --check
      - name: Snapshot + leakage gate
        run: |
          uv run polarity data verify
          uv run polarity audit
      - name: M2 baseline drift gate (keyless; no model inference)
        run: uv run polarity baseline report --check
      - name: M3 config + manifest gate (keyless; no training)
        run: uv run polarity train fingerprint
      - name: M3 report drift gate (keyless; every experiment's committed predictions)
        run: |
          for c in configs/train/*.yaml; do
            uv run polarity train report --check --config "$c"
          done
      - name: M6 Veritas transfer drift gate (keyless; committed scores + frozen protocol)
        run: uv run polarity transfer report --check
      - name: M6.1 authored-probe drift gate (keyless; no model inference)
        run: uv run polarity transfer probe-report --check
      - name: M6.1 MRPC structural gate (source-free; metrics intentionally not reproduced)
        run: uv run polarity transfer mrpc-report --check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install and run Gitleaks 8.30.0
        env:
          GITLEAKS_ARCHIVE_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "$GITLEAKS_ARCHIVE_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --log-opts="--all" --no-banner
